{% extends "settings/layout.html" %}

{% block fields %}
  <p class="muted">The agent uses any OpenAI-compatible chat API: a local server (Ollama, LM Studio, llama.cpp), OpenAI, OpenRouter, or Anthropic's compatible endpoint. The model must support tool calling.</p>

  <label class="field">
    Server URL
    <input name="base_url" value="{{ current.agent_base_url }}" placeholder="http://localhost:11434/v1">
  </label>

  <label class="field">
    Model
    <input name="model" value="{{ current.agent_model }}" placeholder="qwen3:8b">
  </label>

  <label class="field">
    API key
    <input name="api_key" type="password" autocomplete="off"
           placeholder="{{ 'Saved, leave blank to keep it' if current.agent_api_key else 'Not needed for most local servers' }}">
    <span class="muted">For testing only, the key is saved in plain text in the workspace's settings file.</span>
  </label>

  <div class="field">
    <span><button class="button secondary" type="submit" name="action" value="test">Save and test connection</button></span>
    {% if test %}<p class="{{ 'muted' if test_ok else 'error' }}">{{ test }}</p>{% endif %}
  </div>
{% endblock %}
