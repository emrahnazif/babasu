{# Agent chat, the default sidebar content. Behaviour in js/chat.js.
   Saved turns are rendered here with these macros; the <template>s at the bottom use the same
   macros, and chat.js clones them for a turn that is streaming. One source of markup. #}
{% macro user_message(text) -%}
  <div class="chat__message chat__message--user">{{ text }}</div>
{%- endmacro %}

{# The agent's text: its markdown, as text; chat.js renders it (js/markdown.js). Rendered in the
   browser on purpose: saved and streaming replies share one renderer, so they can't differ. #}
{% macro text_part(text) -%}
  <div class="chat__text">{{ text }}</div>
{%- endmacro %}

{# A tool call: running (spinner), done (check) or error (cross). The icon follows data-status. #}
{% macro tool_part(name, status) -%}
  <div class="chat__tool" data-status="{{ status }}">
    <span class="chat__tool-icon" aria-hidden="true"><span class="chat__spinner"></span>{{ icon("check") }}{{ icon("x-mark") }}</span>
    <span class="chat__tool-name">{{ name }}</span>
  </div>
{%- endmacro %}

{# Who wrote an agent turn: the agent's name, with its model on hover. #}
{% macro by_line(agent, model) -%}
  <p class="chat__by" title="{{ agent }} · {{ model }}">{{ agent }}</p>
{%- endmacro %}

{% macro note(kind, text) -%}
  {# kind: "status" (shimmering, while working), "error" or "stopped" #}
  <p class="chat__note chat__note--{{ kind }}">{{ text }}</p>
{%- endmacro %}

{% set chat = agent_chat(request, page_title) %}
<div class="chat{% if chat.running %} chat--busy{% endif %}">
  <div class="chat__messages" role="log" aria-label="Messages">
    <div class="chat__empty" {% if chat.turns %}hidden{% endif %}>
      {{ logo() }}
      <h2>What should we build?</h2>
      {% if chat.agents %}
        <p>Ask the agent about your data, or to build a view.</p>
      {% else %}
        <p>Add a model and an agent in <a href="/settings/models?next={{ request.url.path | urlencode }}">Settings</a> to start.</p>
      {% endif %}
    </div>

    {% for turn in chat.turns %}
      {% if turn.role == "user" %}
        {{ user_message(turn.text) }}
      {% else %}
        <div class="chat__message chat__message--agent" data-status="{{ turn.status }}">
          {% for part in turn.parts %}
            {% if part.kind == "text" %}{{ text_part(part.text) }}{% else %}{{ tool_part(part.name, part.status) }}{% endif %}
          {% endfor %}
          {% if turn.status == "error" %}{{ note("error", turn.error) }}{% endif %}
          {% if turn.status == "stopped" %}{{ note("stopped", "Stopped") }}{% endif %}
          {% if turn.agent %}{{ by_line(turn.agent, turn.model) }}{% endif %}
        </div>
      {% endif %}
    {% endfor %}
    {# The agent is answering: chat.js follows the reply (GET /api/agent/turn) and fills this in. #}
    {% if chat.running %}
      <div class="chat__message chat__message--agent" data-status="streaming" data-following>{{ note("status", "Thinking…") }}</div>
    {% endif %}
  </div>

  <form class="chat__form">
    <textarea class="chat__input" name="message" placeholder="Ask the agent…" aria-label="Message"></textarea>
    <div class="chat__bar">
      {% if chat.agents %}
        {# The agent this chat talks to; changing it applies from the next message. #}
        <select class="chat__agent" name="agent" aria-label="Agent">
          {% for a in chat.agents %}
            <option value="{{ a.id }}"{% if a.id == chat.agent_id %} selected{% endif %}>{{ a.name }}</option>
          {% endfor %}
        </select>
      {% endif %}
      <button class="icon-button icon-button--primary chat__send" type="submit" aria-label="Send" title="Send">
        {{ icon("arrow-up") }}{{ icon("stop") }}
      </button>
    </div>
  </form>

  <template id="chat-user">{{ user_message("") }}</template>
  <template id="chat-agent"><div class="chat__message chat__message--agent" data-status="streaming"></div></template>
  <template id="chat-text">{{ text_part("") }}</template>
  <template id="chat-tool">{{ tool_part("", "running") }}</template>
  <template id="chat-status">{{ note("status", "Thinking…") }}</template>
  <template id="chat-error">{{ note("error", "") }}</template>
  <template id="chat-stopped">{{ note("stopped", "Stopped") }}</template>
  <template id="chat-by">{{ by_line("", "") }}</template>
</div>
