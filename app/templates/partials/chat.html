{# Agent chat, the default sidebar content. Behaviour in js/chat.js.
   Saved turns are rendered here with these macros; the <template>s at the bottom use the same
   macros, and chat.js clones them for a turn that is streaming. One source of markup. #}
{% from "partials/select.html" import select %}
{# The person's message, and under it the images they attached (`shown`). #}
{% macro user_message(text, shown=none) -%}
  <div class="chat__message chat__message--user selectable">{{ text }}</div>
  {%- if shown %}{% include "partials/chat-images.html" %}{% endif %}
{%- endmacro %}

{# The agent's text: its markdown, as text; chat.js renders it (js/markdown.js). Rendered in the
   browser on purpose: saved and streaming replies share one renderer, so they can't differ. #}
{% macro text_part(text) -%}
  <div class="chat__text selectable">{{ text }}</div>
{%- endmacro %}

{# A step the agent takes (a tool call): what it's doing, then what came out (its note, or why it
   failed: that can be selected and copied), and under it the images it found, or the picture it
   looked at. Running (spinner), done (check) or error (cross): the icon follows data-status. #}
{% macro tool_part(label, note, status, shown=none, picture=none) -%}
  <div class="chat__tool" data-status="{{ status }}">
    <span class="chat__tool-icon" aria-hidden="true"><span class="chat__spinner"></span>{{ icon("check") }}{{ icon("x-mark") }}</span>
    <span class="chat__tool-label">{{ label }}</span>
    <span class="chat__tool-note{% if status == 'error' %} selectable{% endif %}">{{ note }}</span>
    {%- if shown %}{% include "partials/chat-images.html" %}{% endif %}
    {%- if picture %}{{ picture_part(picture) }}{% endif %}
  </div>
{%- endmacro %}

{# The picture a step gave the agent's model, as the model saw it. #}
{% macro picture_part(src) -%}
  <div class="chat__picture"><img src="{{ src }}" alt="What the agent looked at" loading="lazy"></div>
{%- endmacro %}

{# Who wrote an agent turn: the agent's name; on hover its model, and the tokens the model read and
   wrote in the turn (when its server says). #}
{% macro by_line(agent, model, tokens_in=0, tokens_out=0) -%}
  <p class="chat__by" title="{{ agent }} · {{ model }}{% if tokens_in %} · {{ tokens_in | number }} tokens read, {{ tokens_out | number }} written{% endif %}">{{ agent }}</p>
{%- endmacro %}

{% macro note(kind, text) -%}
  {# kind: "status" (shimmering, while working), "error" (can be selected and copied) or "stopped" #}
  <p class="chat__note chat__note--{{ kind }}{% if kind == 'error' %} selectable{% endif %}">{{ text }}</p>
{%- endmacro %}

{% set chat = agent_chat(request, page_title) %}
<div class="chat{% if chat.running %} chat--busy{% endif %}">
  <div class="chat__messages" role="log" aria-label="Messages">
    <div class="chat__empty" {% if chat.turns %}hidden{% endif %}>
      {{ logo() }}
      <h2>What should we build?</h2>
      {% if chat.agents %}
        <p>Ask the agent about your data, or to do something with it.</p>
      {% else %}
        <p>Add a model and an agent in <a href="/settings/models?next={{ request.url.path | urlencode }}">Settings</a> to start.</p>
      {% endif %}
    </div>

    {% for turn in chat.turns %}
      {% if turn.role == "user" %}
        {{ user_message(turn.text, turn.shown) }}
      {% else %}
        <div class="chat__message chat__message--agent" data-status="{{ turn.status }}">
          {% for part in turn.parts %}
            {% if part.kind == "text" %}{{ text_part(part.text) }}{% else %}{{ tool_part(part.label, part.note, part.status, part.shown, part.picture) }}{% endif %}
          {% endfor %}
          {% if turn.status == "error" %}{{ note("error", turn.error) }}{% endif %}
          {% if turn.status == "stopped" %}{{ note("stopped", "Stopped") }}{% endif %}
          {% if turn.agent %}{{ by_line(turn.agent, turn.model, turn.tokens_in, turn.tokens_out) }}{% endif %}
        </div>
      {% endif %}
    {% endfor %}
    {# The agent is answering: chat.js follows the reply (GET /api/agent/turn) and fills this in. #}
    {% if chat.running %}
      <div class="chat__message chat__message--agent" data-status="streaming" data-following>{{ note("status", "Thinking…") }}</div>
    {% endif %}
  </div>

  <form class="chat__form" id="chat-form">
    <textarea class="chat__input" id="chat-input" name="message" placeholder="Ask the agent…" aria-label="Message"></textarea>
    <div class="chat__bar">
      {% if chat.agents %}
        {# The agent this chat talks to; changing it applies from the next message. #}
        {{ select("chat-agent-select", "agent", chat.agents | options("id", "name"), chat.agent_id, label="Agent", compact=true, class="chat__agent") }}
      {% endif %}
      <button class="icon-button icon-button--primary chat__send" type="submit" aria-label="Send" title="Send">
        {{ icon("arrow-up") }}{{ icon("stop") }}
      </button>
    </div>
  </form>

  <template id="chat-user">{{ user_message("") }}</template>
  <template id="chat-agent"><div class="chat__message chat__message--agent" data-status="streaming"></div></template>
  <template id="chat-text">{{ text_part("") }}</template>
  <template id="chat-tool">{{ tool_part("", "", "running") }}</template>
  <template id="chat-picture">{{ picture_part("") }}</template>
  {# While a tool runs (run_code): what it prints, and how far it is (progress(done, total)). #}
  <template id="chat-output"><pre class="chat__output"></pre></template>
  <template id="chat-progress"><div class="progress chat__progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100"></div></template>
  <template id="chat-status">{{ note("status", "Thinking…") }}</template>
  <template id="chat-error">{{ note("error", "") }}</template>
  <template id="chat-stopped">{{ note("stopped", "Stopped") }}</template>
  <template id="chat-by">{{ by_line("", "") }}</template>
</div>
