[project]
name = "babasu"
version = "0.1.0"
description = "Desktop app: FastAPI + Jinja served locally, shown in a pywebview window."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "pywebview>=5.3",
    "platformdirs>=4.14.5",
    "python-multipart>=0.0.33",
    "pillow>=13.0.0",
    "openai>=3.49.0",
    "mozo>=1.7.0",
    "pixelflow>=0.7",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
]

[tool.uv]
package = false

# Until pixelflow 0.8 and mozo 1.8 are released, babasu runs on the local checkouts (todo.md §9).
# At release: drop this and raise the requirements above.
[tool.uv.sources]
pixelflow = { path = "../pixelflow", editable = true }
mozo = { path = "../../Intranet/mozo", editable = true }
