[project]
name = "babasu"
version = "0.1.0"
description = "Desktop app: FastAPI + Jinja served locally, shown in a pywebview window."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "pywebview>=5.3",
    "platformdirs>=4.14.5",
    "python-multipart>=0.0.33",
    "pillow>=13.0.0",
    "openai>=3.49.0",
    "mozo>=1.14.0",
    "pixelflow>=0.11.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
